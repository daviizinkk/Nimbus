services:
  nimbus:
    build: .
    image: nimbus-vault:latest
    container_name: nimbus
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /data
      TRUST_PROXY: "false"
      MAX_UPLOAD_MB: "4096"
      CACHE_LIMIT_MB: "8192"
    volumes:
      - nimbus-data:/data

volumes:
  nimbus-data:
