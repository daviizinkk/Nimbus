<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Nimbus — a private cloud you actually own</title>
  <desc id="description">Nimbus banner with a dark indigo background, the Nimbus cloud mark, and a preview of the private media library.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset=".55" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b31"/>
      <stop offset="1" stop-color="#0b1221"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="tileC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="tileD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#020617" flood-opacity=".72"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94a3b8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <clipPath id="round">
      <rect width="1280" height="640" rx="0"/>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="704" y="104" width="488" height="448" rx="28"/>
    </clipPath>
    <clipPath id="tileOne">
      <rect x="808" y="234" width="160" height="112" rx="14"/>
    </clipPath>
    <clipPath id="tileTwo">
      <rect x="980" y="234" width="160" height="112" rx="14"/>
    </clipPath>
    <clipPath id="tileThree">
      <rect x="808" y="358" width="160" height="112" rx="14"/>
    </clipPath>
    <clipPath id="tileFour">
      <rect x="980" y="358" width="160" height="112" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="640" fill="#070b15"/>
    <rect width="1280" height="640" fill="url(#grid)"/>
    <ellipse cx="230" cy="62" rx="570" ry="480" fill="url(#glowLeft)"/>
    <ellipse cx="1140" cy="610" rx="530" ry="430" fill="url(#glowRight)"/>
    <ellipse cx="695" cy="330" rx="230" ry="260" fill="#312e81" opacity=".12"/>

    <!-- Brand -->
    <g>
      <rect x="88" y="60" width="76" height="76" rx="21" fill="url(#brand)"/>
      <rect x="88.5" y="60.5" width="75" height="75" rx="20.5" fill="none" stroke="#c7d2fe" stroke-opacity=".28"/>
      <g transform="translate(103 75) scale(.844)">
        <path d="M20 40.5h24a7.5 7.5 0 0 0 .9-14.95A11.5 11.5 0 0 0 22.6 24.6 7.5 7.5 0 0 0 20 40.5Z" fill="#fff" opacity=".98"/>
        <path d="M25 45.5h14" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
      </g>
      <text x="182" y="99" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="41" font-weight="700" letter-spacing="-1">Nimbus</text>
      <text x="183" y="124" fill="#93a4c3" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3.4">PRIVATE MEDIA VAULT</text>
    </g>

    <!-- Headline -->
    <text x="88" y="235" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">A private cloud</text>
    <text x="88" y="303" fill="url(#headline)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">you actually own.</text>
    <text x="90" y="353" fill="#a9b7ce" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="400">Photos, videos and files in one beautiful library,</text>
    <text x="90" y="381" fill="#a9b7ce" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="400">backed by storage you control.</text>

    <!-- Feature chips -->
    <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="600">
      <rect x="89" y="432" width="145" height="40" rx="20" fill="#ffffff" fill-opacity=".055" stroke="#c7d2fe" stroke-opacity=".16"/>
      <circle cx="111" cy="452" r="4.5" fill="#34d399"/>
      <text x="126" y="457" fill="#dce5f5">Self-hosted</text>

      <rect x="246" y="432" width="146" height="40" rx="20" fill="#ffffff" fill-opacity=".055" stroke="#c7d2fe" stroke-opacity=".16"/>
      <circle cx="268" cy="452" r="4.5" fill="#818cf8"/>
      <text x="283" y="457" fill="#dce5f5">Private by design</text>

      <rect x="404" y="432" width="143" height="40" rx="20" fill="#ffffff" fill-opacity=".055" stroke="#c7d2fe" stroke-opacity=".16"/>
      <circle cx="426" cy="452" r="4.5" fill="#22d3ee"/>
      <text x="441" y="457" fill="#dce5f5">No lock-in</text>
    </g>

    <!-- App preview -->
    <g filter="url(#shadow)">
      <rect x="704" y="104" width="488" height="448" rx="28" fill="url(#panel)" stroke="#a5b4fc" stroke-opacity=".19"/>
    </g>
    <g clip-path="url(#panelClip)">
      <circle cx="1130" cy="124" r="150" fill="#6366f1" opacity=".08"/>
      <circle cx="762" cy="516" r="130" fill="#06b6d4" opacity=".075"/>

      <!-- Window chrome -->
      <circle cx="732" cy="132" r="4" fill="#fb7185" opacity=".9"/>
      <circle cx="746" cy="132" r="4" fill="#fbbf24" opacity=".9"/>
      <circle cx="760" cy="132" r="4" fill="#34d399" opacity=".9"/>
      <text x="778" y="136" fill="#7d8bab" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.4">NIMBUS</text>
      <rect x="1090" y="119" width="78" height="26" rx="13" fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-opacity=".24"/>
      <circle cx="1104" cy="132" r="3.5" fill="#34d399"/>
      <text x="1114" y="136" fill="#86efac" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing=".5">PRIVATE</text>
      <line x1="704" y1="158" x2="1192" y2="158" stroke="#94a3b8" stroke-opacity=".1"/>

      <!-- Side rail -->
      <rect x="704" y="158" width="74" height="395" fill="#080e1b" opacity=".66"/>
      <rect x="725" y="179" width="32" height="32" rx="9" fill="url(#brand)"/>
      <g transform="translate(733 187) scale(.375)">
        <path d="M20 40.5h24a7.5 7.5 0 0 0 .9-14.95A11.5 11.5 0 0 0 22.6 24.6 7.5 7.5 0 0 0 20 40.5Z" fill="#fff"/>
        <path d="M25 45.5h14" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
      </g>
      <rect x="730" y="235" width="24" height="24" rx="7" fill="#6366f1" fill-opacity=".18"/>
      <path d="M735 247h14M735 242h14M735 252h14" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
      <circle cx="742" cy="283" r="7" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <circle cx="742" cy="283" r="2.5" fill="#64748b"/>
      <path d="M732 318h20v14h-20z" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M737 324l4 4 4-7 5 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="742" cy="354" r="7" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <path d="M742 351v3l2 1" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Library content -->
      <text x="808" y="192" fill="#f3f7ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-.5">Your library</text>
      <rect x="978" y="176" width="190" height="28" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#94a3b8" stroke-opacity=".13"/>
      <circle cx="994" cy="190" r="4.5" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <path d="M997.5 193.5l3 3" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
      <text x="1006" y="194" fill="#64748b" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9.5">Search your library</text>

      <!-- Tiles -->
      <g>
        <rect x="808" y="234" width="160" height="112" rx="14" fill="url(#tileA)"/>
        <g clip-path="url(#tileOne)">
          <circle cx="927" cy="252" r="16" fill="#fbbf24" opacity=".5"/>
          <path d="M794 342l49-62 31 37 23-24 44 49v16H794z" fill="#c7d2fe" opacity=".2"/>
          <path d="M794 350l37-42 30 33 25-26 51 53v2H794z" fill="#0f172a" opacity=".35"/>
        </g>
        <rect x="808.5" y="234.5" width="159" height="111" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
        <rect x="816" y="322" width="66" height="16" rx="8" fill="#050a13" opacity=".55"/>
        <text x="824" y="333" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" font-weight="600">251 photos</text>
      </g>

      <g>
        <rect x="980" y="234" width="160" height="112" rx="14" fill="url(#tileB)"/>
        <g clip-path="url(#tileTwo)">
          <circle cx="1060" cy="278" r="32" fill="#fb7185" opacity=".48"/>
          <circle cx="1113" cy="254" r="14" fill="#fde68a" opacity=".35"/>
          <path d="M966 340l54-47 35 27 26-19 59 45v12h-174z" fill="#fce7f3" opacity=".16"/>
        </g>
        <rect x="980.5" y="234.5" width="159" height="111" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
        <rect x="988" y="322" width="55" height="16" rx="8" fill="#050a13" opacity=".55"/>
        <text x="996" y="333" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" font-weight="600">38 videos</text>
      </g>

      <g>
        <rect x="808" y="358" width="160" height="112" rx="14" fill="url(#tileC)"/>
        <g clip-path="url(#tileThree)">
          <circle cx="927" cy="376" r="16" fill="#67e8f9" opacity=".5"/>
          <path d="M794 465l43-46 29 26 30-34 46 53v6H794z" fill="#67e8f9" opacity=".16"/>
          <path d="M794 472l57-43 28 22 28-30 62 51v-9H794z" fill="#0f172a" opacity=".3"/>
        </g>
        <rect x="808.5" y="358.5" width="159" height="111" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
        <rect x="816" y="446" width="62" height="16" rx="8" fill="#050a13" opacity=".55"/>
        <text x="824" y="457" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" font-weight="600">126 files</text>
      </g>

      <g>
        <rect x="980" y="358" width="160" height="112" rx="14" fill="url(#tileD)"/>
        <g clip-path="url(#tileFour)">
          <circle cx="1074" cy="405" r="30" fill="#22d3ee" opacity=".28"/>
          <path d="M1094 441l-20-20 10-9 14 7 17-25 31 30v32h-64z" fill="#a5b4fc" opacity=".2"/>
        </g>
        <rect x="980.5" y="358.5" width="159" height="111" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
        <rect x="988" y="446" width="72" height="16" rx="8" fill="#050a13" opacity=".55"/>
        <text x="996" y="457" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" font-weight="600">Shared vault</text>
      </g>

      <!-- Storage footer -->
      <rect x="808" y="490" width="332" height="38" rx="12" fill="#ffffff" fill-opacity=".035" stroke="#94a3b8" stroke-opacity=".11"/>
      <path d="M825 515.5h24a4 4 0 0 0 .5-7.97 6.5 6.5 0 0 0-12.5-1.75 4 4 0 0 0-12 3.72z" fill="#a5b4fc" opacity=".85"/>
      <text x="859" y="509" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8.5" font-weight="600">Your private storage</text>
      <text x="859" y="521" fill="#64748b" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="7.5">Local  ·  GitHub Releases  ·  WebDAV</text>
      <circle cx="1116" cy="509" r="3" fill="#34d399"/>
      <text x="1124" y="512" fill="#86efac" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="7.5" font-weight="700">SYNCED</text>
    </g>

    <!-- Floating Discord badge -->
    <g filter="url(#softShadow)">
      <rect x="1020" y="72" width="150" height="54" rx="17" fill="#0c1322" stroke="#c7d2fe" stroke-opacity=".18"/>
      <rect x="1032" y="84" width="30" height="30" rx="10" fill="#5865f2"/>
      <path d="M1040 93.4c3.2-1.4 6.6-1.4 10 0 .2.1.3.3.4.5l.7 1.7c-2.7 1.2-4.2 1.7-5.6 2-.1-.3-.3-.7-.5-1-.6.1-1.2.1-1.8 0-.2.3-.4.7-.5 1-1.4-.3-2.9-.8-5.6-2l.7-1.7c.1-.2.2-.4.4-.5l1.8.3zm1.6 1.8c-.5 0-.9.5-.9 1s.4 1 .9 1 .9-.4.9-1-.4-1-.9-1zm4.6 0c-.5 0-.9.5-.9 1s.4 1 .9 1 .9-.4.9-1-.4-1-.9-1z" fill="#fff"/>
      <text x="1073" y="94" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1">DISCORD</text>
      <text x="1073" y="108" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.5" font-weight="600">Rich Presence</text>
      <circle cx="1153" cy="99" r="3.2" fill="#34d399"/>
    </g>

    <!-- Bottom accent -->
    <line x1="88" y1="550" x2="640" y2="550" stroke="#94a3b8" stroke-opacity=".14"/>
    <text x="88" y="579" fill="#64748b" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.6">VERSION 1.3</text>
    <text x="640" y="579" text-anchor="end" fill="#64748b" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.1">YOUR MEMORIES. YOUR STORAGE.</text>
  </g>
</svg>
